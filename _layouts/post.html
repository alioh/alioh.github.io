---
layout: default
---

<article class="post">

  <h1>{{ page.icon }} {{ page.title }}</h1>
  <div class="entry">
    {{ content }}
  </div>

  <div class="date">
    كُتب في {{ page.date | date: "%d/%m/%Y" }}
  </div>

  <hr>
  {% unless page.no_ads %}
  <div class="entry" style="margin-top: 2em; margin-bottom: 2em;">
    <ins class="adsbygoogle"
         style="display:block; text-align:center;"
         data-ad-layout="in-article"
         data-ad-format="fluid"
         data-ad-client="ca-pub-8513572715092457"
         data-ad-slot="6218614286"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>
  {% endunless %}

  {% comment %} {% include disqus.html %} {% endcomment %}
  {% comment %} {% include comments.html %} {% endcomment %}
</article>
