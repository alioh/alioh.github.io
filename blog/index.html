---
layout: default
title: المدونة
permalink: /blog/
---

<h1>المدونة</h1>

<div class="posts">
  {% for post in site.posts %}
    <article class="post">
      <h2><a href="{{ site.baseurl }}{{ post.url }}">{{ post.icon }} {{ post.title }}</a></h2>
      <div class="date">{{ post.date | date: "%d/%m/%Y" }}</div>

      <div class="entry">
        {{ post.excerpt }}
      </div>

      <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">اكمل القراءة</a>
    </article>
  {% endfor %}
</div>
