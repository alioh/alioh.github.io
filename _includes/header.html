<div class="wrapper-masthead">
  <div class="container">
    <header class="masthead clearfix">
      {% if site.avatar %}
      <a href="{{ site.baseurl }}/" class="site-avatar"><img src="{{ site.avatar }}" /></a>
      {% endif %}

      <div class="site-info">
        <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
        <p class="site-description">{{ site.description }}</p>
      </div>

      <nav>
        <a href="{{ site.baseurl }}/">الرئيسية</a>
        <a href="{{ site.baseurl }}/blog">المدونة</a>
        <a href="{{ site.baseurl }}/other">محتوى آخر</a>
        <a href="{{ site.baseurl }}/about">من أنا</a>
        <a href="{{ site.baseurl }}/contact">تواصل</a>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="تبديل المظهر الداكن/الفاتح" aria-pressed="false">
          {% include icon.html name="sun" %}
          {% include icon.html name="moon" %}
        </button>
      </nav>
    </header>
  </div>
</div>
